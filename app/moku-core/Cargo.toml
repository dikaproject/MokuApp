[package]
name = "moku-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Moku shared library: config schema, data paths, IPC protocol (plain Rust, plus the user-SID check of the pipe client)."

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Only the pipe client's "is the listening program really mine" check (user SIDs), `apps` (the name
# of the process in front) and `locale` (the user's Windows locale name); everything else in this
# crate stays plain Rust.
[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging",
    # Tanya AI (v0.3 track M): Credential Manager (secrets.rs), CNG + DPAPI (aimem.rs)
    "Win32_Security_Credentials", "Win32_Security_Cryptography",
]

[target.'cfg(windows)'.dev-dependencies.windows]
workspace = true
features = ["Win32_Storage_FileSystem"]
