[package]
name = "moku"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Moku island (moku.exe)"

[dependencies]
moku-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
windows-numerics.workspace = true
windows-future.workspace = true

# Every Windows API area the feature tracks need is enabled here up front, so tracks rarely
# have to touch this file (grouped by who uses it).
[dependencies.windows]
workspace = true
features = [
    # --- core: composition, D2D/DirectWrite, windows, tray, hotkeys, pipe -------------------
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Graphics",
    "Graphics_DirectX",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",                # text inputs: IME composition / candidate window
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Networking_WinHttp",          # crate::net (weather, lyrics)
    # --- track I: updater (SHA-256 of the downloaded installer via CNG) ------------------------
    "Win32_Security_Cryptography",
    # --- track A: media session, album art, Core Audio, radios, dark mode, brightness ------
    "Media",
    "Media_Control",                     # GlobalSystemMediaTransportControlsSessionManager
    "Media_Core",                        # MediaSource (the adzan sound, track N)
    "Media_Playback",                    # MediaPlayer (the adzan sound, track N)
    "Storage",
    "Storage_Streams",                   # thumbnail streams
    "Graphics_Imaging",                  # BitmapDecoder for album art
    "Devices_Radios",
    "Devices_Enumeration",
    "UI_ViewManagement",                 # UISettings (accent / theme)
    "Win32_Media_Audio",                 # IMMDeviceEnumerator, IMMNotificationClient
    "Win32_Media_Audio_Endpoints",       # IAudioEndpointVolume(+Callback)
    "Win32_Devices_FunctionDiscovery",   # PKEY_Device_FriendlyName
    "Win32_Devices_Properties",
    "Win32_UI_Shell_PropertiesSystem",   # IPropertyStore
    "Win32_System_Com_StructuredStorage",# PROPVARIANT
    "Win32_System_Variant",              # VARIANT (WMI)
    "Win32_System_Wmi",                  # WmiMonitorBrightness(Methods)
    "Win32_System_Power",                # SetThreadExecutionState, power notifications
    "Win32_System_Registry",             # dark mode, ConsentStore, autostart
    # --- track H: Bluetooth headset battery, per-app mixer ---------------------------------
    "Devices_Bluetooth",                 # BluetoothDevice (connection state, class of device)
    "Win32_Devices_DeviceAndDriverInstallation", # CfgMgr32: device-node properties (battery level)
    # --- track B: battery, raw input, network, privacy dots, monitor -----------------------
    "Win32_UI_Input",                    # Raw Input (Caps Lock)
    "Win32_Networking_NetworkListManager",
    "Win32_NetworkManagement_IpHelper",  # GetIfTable2
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Performance",          # PDH (GPU utilisation)
    "Win32_System_SystemInformation",    # GlobalMemoryStatusEx, GetLocalTime
    "Win32_System_ProcessStatus",        # process names
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemServices",
    "Win32_System_Ole",                  # OLE drag & drop (shelf), also OleInitialize in main
    # --- track D: clipboard, capture, shelf ----------------------------------------------------
    "Win32_System_DataExchange",         # clipboard, AddClipboardFormatListener
    "Win32_System_Memory",               # GlobalAlloc / GlobalLock
    "Win32_Graphics_Imaging",            # WIC (PNG encode/decode, thumbnails)
    "Win32_UI_Shell_Common",             # file icons / SHGetFileInfo
    "Win32_System_Environment",
    "Win32_System_Time",
    "Win32_System_Console",
    "ApplicationModel",
    "ApplicationModel_DataTransfer",
    # --- v0.3 track Q: notification mirror (UserNotificationListener) --------------------------
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Storage_Packaging_Appx",      # GetCurrentPackageFullName: does this exe have a package identity?
    # --- track L: screen OCR (Windows.Media.Ocr) --------------------------------------------
    "Media_Ocr",                         # OcrEngine, OcrResult
    "Globalization",                     # Language (the OCR language tags)
    # --- v0.3 track R: Shelf converter (MediaTranscoder: audio / video -> MP3, M4A, MP4) --------
    "Media_Transcoding",
    "Media_MediaProperties",
]
