name: Release

# Push a tag like v0.2.0 (it must match [workspace.package] version in app/Cargo.toml and have a
# section in CHANGELOG.md). Builds, packages and publishes a GitHub Release with:
#   moku-setup.exe, moku-setup.exe.sha256 + moku-setup.exe.sig (both checked by the in-app updater),
#   Moku-<v>-portable.zip
# Needs the repository secret MOKU_SIGNING_KEY: the whole text of the private key file made by
# app/tools/release-key.ps1 (never commit it), REPO and UPDATE_PUBLIC_KEY set in
# app/moku-core/src/release.rs (release.ps1 refuses to package otherwise).
on:
  push:
    tags: ["v*"]

# Nothing is writable by default; only the release job may write (to create the release).
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      # The project keeps zero warnings.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (the version pinned in rust-toolchain.toml)
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app
      - name: Signing key
        env:
          SIGNING_KEY_TEXT: ${{ secrets.MOKU_SIGNING_KEY }}
        run: |
          if (-not $env:SIGNING_KEY_TEXT) { throw "the repository secret MOKU_SIGNING_KEY is not set (see app/tools/release-key.ps1)" }
          $path = Join-Path $env:RUNNER_TEMP "moku-signing-key.txt"
          [IO.File]::WriteAllText($path, $env:SIGNING_KEY_TEXT)
          "MOKU_SIGNING_KEY=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test, build and package
        # release.ps1 runs cargo test --workspace and the release builds with --locked.
        run: ./app/tools/release.ps1 -Tag "${{ github.ref_name }}" -OutDir "${{ github.workspace }}/dist"
      - name: Remove the signing key
        if: always()
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "moku-signing-key.txt")
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          $files = "dist/moku-setup.exe", "dist/moku-setup.exe.sha256", "dist/moku-setup.exe.sig", "dist/Moku-$ver-portable.zip"
          $flags = @("--title", "Moku $ver", "--notes-file", "dist/release-notes.md", "--verify-tag")
          # A tag with a pre-release part (v0.3.0-rc.1) becomes a pre-release, which the in-app
          # updater ignores.
          if ($ver -match '-') { $flags += "--prerelease" }
          gh release create $tag @files @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
