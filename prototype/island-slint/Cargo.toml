[package]
name = "island-slint"
version = "0.1.0"
edition = "2021"
build = "build.rs"
publish = false

# Two binaries from one source: FemtoVG/OpenGL (default) and Slint's software renderer.
#   cargo build --release                                   -> moku-island-slint.exe
#   cargo build --release --no-default-features --features sw -> moku-island-slint-sw.exe
[[bin]]
name = "moku-island-slint"
path = "src/main.rs"
required-features = ["femtovg"]

[[bin]]
name = "moku-island-slint-sw"
path = "src/main.rs"
required-features = ["sw"]

[features]
default = ["femtovg"]
femtovg = ["slint/renderer-femtovg"]
sw = ["slint/renderer-software", "slint/software-renderer-systemfonts", "slint/software-renderer-path"]

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "backend-winit", "unstable-winit-030", "compat-1-2"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
